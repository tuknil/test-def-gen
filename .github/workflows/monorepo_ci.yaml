name: CI - Node - Monorepo

on:
  schedule:
    - cron: '00 02 * * *'

  push:
    branches: [ "main" ]

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      apps_to_build:
        description: 'Application to Build'
        required: true
        type: choice
        options:
          - AUTO
          - ALL
        default: 'AUTO'

      enable_unit_tests:
        description: 'Enable Unit Tests'
        default: false
        required: true
        type: boolean

      enable_component_tests:
        description: 'Enable component tests'
        default: false
        required: true
        type: boolean

      enable_sonar:
        description: 'Enable Sonar'
        default: true
        required: true
        type: boolean

      enable_veracode_sast:
        description: 'Enable VeraCode SAST'
        default: false
        required: true
        type: boolean

      enable_veracode_sca:
        description: 'Enable VeraCode SCA'
        default: false
        required: true
        type: boolean

      enable_veracode_pipeline_scan:
        description: 'Enable VeraCode Pipeline Scan'
        default: false
        required: false
        type: boolean

      enable_deployment:
        description: 'Enable Deployment'
        default: true
        required: true
        type: boolean

      log_level:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
      enable_stage_deployment:
        description: 'Push Stage Repo'
        default: false
        required: true
        type: boolean


      enable_Azure_deployment:
        description: 'Push Azure ACA'
        default: false
        required: true
        type: boolean

jobs:
  run:
    name: Run Node Monorepo CI Workflow
    secrets: inherit
    uses: ATT-IDP/revup-workflows/.github/workflows/reusable_workflow_node_monorepo_ci.yaml@v5
    with:
      apps_to_build: ${{ github.event.inputs.apps_to_build }}
      enable_unit_tests: ${{ github.event.inputs.enable_unit_tests }}
      enable_component_tests: ${{ github.event.inputs.enable_component_tests }}
      enable_sonar: ${{ github.event.inputs.enable_sonar }}
      enable_veracode_sast: ${{ github.event.inputs.enable_veracode_sast }}
      enable_veracode_sca: ${{ github.event.inputs.enable_veracode_sca }}
      enable_veracode_pipeline_scan: ${{ github.event.inputs.enable_veracode_pipeline_scan }}
      enable_deployment: ${{ github.event.inputs.enable_deployment }}
      log_level: ${{ github.event.inputs.log_level }}
      runner_group: 'concordia-linux-cpu2-ram7gi'

  Call_DevOps:
    name: Call DevOps
    permissions:
      contents: read    
    needs: run
    if: ${{ inputs.enable_stage_deployment == true }}
    runs-on: concordia-linux-cpu2-ram7gi
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print version from shared variables
        id: image-version
        shell: bash
        run: |
          vars_file=".github/variables/shared_vars.yaml"
          version="$(awk -F"'" '/^version:/ { print $2; found=1 } END { if (!found) exit 1 }' "$vars_file")"
          image_version="${version}${GITHUB_RUN_NUMBER}"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "image_version: $image_version"
          echo "======================================"
          echo " Triggering Central CI/CD"
          echo "======================================"
          echo "Source Repository : ${{ github.repository }}"
          echo "Branch            : ${{ github.ref_name }}"
          echo "Commit SHA        : ${{ github.sha }}"
          echo "Triggered By      : ${{ github.actor }}"
          echo "Workflow          : ${{ github.workflow }}"
          echo "Run ID            : ${{ github.run_id }}"
          echo ""
          echo "Images:"
          echo " control-translation"
          echo ""
          echo "Target Repository : apm0047460-DevOPS"
          echo "Event Type        : feature-build"
          echo "======================================"

      - name: Trigger amp0047460-devop
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'apm0047460-DevOPS',
              event_type: 'feature-build',

              client_payload: {
                repository: context.repo.owner + '/apm0047460-Janus-control-translation',
                ref: context.ref.replace('refs/heads/', ''),
                sha: context.sha,
                triggered_by: context.actor,
                jfrog_group: 'apm0047460-dkr-group',
                enable_azure_deployment: ${{ inputs.enable_Azure_deployment }},

                images: [
                  {
                    name: 'janus_defense_validation/janus_defense_validation_api',
                    tag: `${{ steps.image-version.outputs.image_version }}`,
                    aca: `${{ vars.ACA_JANUS_APP_API }}`,
                    rg: `${{ vars.RESOURCE_GROUP }}`,
                  },
                  {
                    name: 'janus_defense_validation/janus_defense_validation_ui',
                    tag: `${{ steps.image-version.outputs.image_version }}`,
                    aca: `${{ vars.ACA_JANUS_APP_UI }}`,
                    rg: `${{ vars.RESOURCE_GROUP }}`,
                  }                  
                ]
              }
            });

            console.log('repository_dispatch sent successfully');
            console.log('Target: amp0047460-devop');
            console.log('Event: feature-build');