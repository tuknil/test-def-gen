name: CI - Node - Monorepo

on:
  schedule:
    - cron: '00 02 * * *'

  push:
    branches: [ "main" ]

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      apps_to_build:
        description: 'Application to Build'
        required: true
        type: choice
        options:
          - AUTO
          - ALL
        default: 'AUTO'

      enable_unit_tests:
        description: 'Enable Unit Tests'
        default: false
        required: true
        type: boolean

      enable_component_tests:
        description: 'Enable component tests'
        default: true
        required: true
        type: boolean

      enable_sonar:
        description: 'Enable Sonar'
        default: true
        required: true
        type: boolean

      enable_veracode_sast:
        description: 'Enable VeraCode SAST'
        default: true
        required: true
        type: boolean

      enable_veracode_sca:
        description: 'Enable VeraCode SCA'
        default: true
        required: true
        type: boolean

      enable_veracode_pipeline_scan:
        description: 'Enable VeraCode Pipeline Scan'
        default: true
        required: false
        type: boolean

      enable_deployment:
        description: 'Enable Deployment'
        default: true
        required: true
        type: boolean

      log_level:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug

jobs:
  run:
    name: Run Node Monorepo CI Workflow
    secrets: inherit
    uses: ATT-IDP/revup-workflows/.github/workflows/reusable_workflow_node_monorepo_ci.yaml@v5
    with:
      apps_to_build: ${{ github.event.inputs.apps_to_build }}
      enable_unit_tests: ${{ github.event.inputs.enable_unit_tests }}
      enable_component_tests: ${{ github.event.inputs.enable_component_tests }}
      enable_sonar: ${{ github.event.inputs.enable_sonar }}
      enable_veracode_sast: ${{ github.event.inputs.enable_veracode_sast }}
      enable_veracode_sca: ${{ github.event.inputs.enable_veracode_sca }}
      enable_veracode_pipeline_scan: ${{ github.event.inputs.enable_veracode_pipeline_scan }}
      enable_deployment: ${{ github.event.inputs.enable_deployment }}
      log_level: ${{ github.event.inputs.log_level }}
      runner_group: 'concordia-linux-cpu2-ram7gi'
      ## Cypress and Playwright are currently not enabled in MonoRepo CI flow.
      ## To permanently disable one of the following tests, set it's values to false.
      # enable_cypress_tests: ${{ github.event.inputs.enable_cypress_tests }}
      # enable_playwright_tests: ${{ github.event.inputs.enable_playwright_tests }}

      ## Cypress Container cypress/included:
      ## https://hub.docker.com/r/cypress/included/tags
      # cypress_docker_tag: ''
