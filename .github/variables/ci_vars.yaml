#+--------------------+
#|    Build           |-------------------------------------------------------------------------------------------------
#+--------------------+
build:

  ## Treating warnings as errors
  ci-flag: 'false'

  ## The path for the application src directory
  npm-project-dir: '.'

  # Used to specify the path to a dependency file: package-lock.json, yarn.lock, etc.
  # It will generate hash from the target file for primary key. It works only If cache is specified.
  # Supports wildcards or a list of file names for caching multiple dependencies.
  npm-cache-dependency-path: ''

  ## Remove package-lock.json file if it exists
  npm-remove-package-lock: false

  ## Command to install dependencies
  npm-dependency: npm ci --legacy-peer-deps

  ## Command to run the build
  
  ## Command to run the linter
  npm-script-lint: ''

  ## Command to run the tests
  npm-script-test: 'npm run test'
  ## If any repository manipulation is required before compilation
  ## write a script, push it to the repository and set its full path:
  # pre-script: '< path/to/file >'

  ## Use the package.json defined version
  ## Optional, Default: false
  # npm-use-package-version: 'true'

  #+--------------------+
  #|    Sonar           |------------------------------------------------------------------------------------------------
  #+--------------------+
sonar:
  property: sonar-project.properties

  properties:
    sonar-debug: 'true'
    sonar-exclusions: '**/node_modules/**,coverage/**,dist/**,build/**,mocks,**/*.test.ts,**/*.test.tsx'
    sonar-inclusions: '**/*.ts,**/*.tsx'
    sonar-javascript-lcov-reportPaths: 'coverage/lcov.info,cypress-e2e-coverage/lcov.info,cypress-component-coverage/lcov.info'
    sonar-language: js
    sonar-qualitygate-wait: 'false' # if false -> Ignore Sonar QG check; if true -> enforce Sonar QG check.  RevUp waits for scan to finish either way.
    sonar-sources: 'src' # Comment in case of MonoRepo project
    sonar-test-inclusions: '**/*test.js,**/*test.ts,**/*test.tsx,**/*cy.ts,**/*cy.tsx'
    sonar-tests: 'src' # Comment in case of MonoRepo project
    sonar-verbose: 'true' # Comment in case of MonoRepo project

  ## Any other Sonar Analysis property keys can be added here
  ## Refer to `https://docs.sonarqube.org/latest/analysis/analysis-parameters/`
  additional-properties: >
    -Dsonar.log_level='INFO'  
  domain: com.att.janus
  name: JANUS-defense-validation

#+--------------------+
#|    SAST            |-----------------------------------------------------------------------------------------------
#+--------------------+
veracode-sast:

  ## Code main language
  language-type: 'node'

  ## File types to be scanned
  file-type-for-scan: "./src ./package.json ./package-lock.json"

  ## Maximum time (in minutes) to wait for Veracode scan completion.
  ## Default: 120. Valid range: 1–359.
  ## IMPORTANT: If increasing this value, also set 'timeout-minutes' on the
  ## veracode-sast job in your workflow to a value >= this setting.
  # scan-timeout-minutes: 120

  ## VeraCode properties
  properties:
    ## The application name in Veracode
    ## In case of MonoRepo project, please comment it
    ## Veracode Profile Name should be as follow:
    ## <mots-id>-<project-acronym>-<service-name>
    {}
    ## The criticality of the application
    ## Valid values: VeryHigh, High, Medium, Low, VeryLow
    ## Default: 'VeryHigh'
    # criticality: 'VeryHigh'

    ## Create a sandbox if not exists in Veracode
    ## Default: false
    # create-sandbox: true

    ## The sandbox name if create-sandbox is set to true
    ## Relevant only for Poly Repo project
    ## Default: 'Default-Sandbox'
    # sandbox-name: <sandbox name>

    ## The debug mode
    ## Default: false
    # debug: true


    #+--------------------+
    #|  Veracode Pipeline |-----------------------------------------------------------------------------------------------
    #|        Scan        |-----------------------------------------------------------------------------------------------
    #+--------------------+

    ## Pipeline scan uses variables from veracode-sast, in addition to below which can be used to reduce false positives
    #veracode-pipeline-scan:
    #timeout: 60
    ## Wildcards can be used, for example: **/node_modules/**,coverage/**,dist/**
    #file-types-to-exclude: ''
    #max-retries: 5


    #+--------------------+
    #|    SCA             |-----------------------------------------------------------------------------------------------
    #+--------------------+
veracode-sca:

  ## VeraCode SCA, Agent Based Scan,  workspace name
  ## Usually its WS-<motsid>
  {}
  ## VeraCode SCA, Agent Based Scan, Project name
  ## Each Workspace can have multiple projects
  ## Set it to get customized name.
  ## Relevant only for Poly Repo project
  # name: '< Project Name >'

  ## Java Options for the scan
  ## In case larger jvm heap size is required
  # javaOpts: '-Xms2048m -Xmx4096m'

  ## Enable SCA upload on PR events (default behavior is no upload on PR)
  # upload-on-pr: 'true'


  #+--------------------+
  #|    Quality Gate    |------------------------------------------------------------------------------------------------
  #+--------------------+
qualitygate:
  java-full-path: "/usr/bin/java"
  project-path: "."
  continues-improvement: 'false'

#+--------------------+
#|    Tests           |------------------------------------------------------------------------------------------------
#+--------------------+
tests:
  cypress:
    enable: 'false'
    install-command: npm install cypress@latest
    run-command: 'npx cypress run --component'
    instrument-production: 'true'
    nyc-report-dir: 'cypress-coverage' # Taking from package.json - nyc report-dir

#+--------------------+
#|    Docker          |------------------------------------------------------------------------------------------------
#+--------------------+
docker:
  dockerfile: 'Dockerfile'
  build-path: '.'

#+--------------------+
#|    Deployment      |------------------------------------------------------------------------------------------------
#+--------------------+
deployment:
  workflow-id: 'cd.yaml'
